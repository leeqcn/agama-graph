site_name: 阿含名相图谱
site_description: 以《杂阿含经》为主线的名相图谱
docs_dir: pages

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.top
    - search.suggest

# 中文搜索分词：上线后试搜「五蕴」「缘起」「无明」，效果不理想再调整
plugins:
  - search

nav:
  - 首页: index.md
  - 名相: terms/index.md
  - 经文: sutras/index.md
  - 关系图: graph.md
  - 关于: about.md

copyright: CC BY-NC-SA 4.0
